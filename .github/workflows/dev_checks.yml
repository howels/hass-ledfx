name: Checks dev HASS

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  tests-dev:
    runs-on: ubuntu-latest
    # The Home Assistant development branch can run ahead of the released
    # pytest-homeassistant-custom-component plugin. A failure is a signal, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the Home Assistant development branch
        run: |
          pip install -r requirements_test.txt
          pip install --upgrade "git+https://github.com/home-assistant/core.git@dev"
      - name: Run tests
        run: pytest
